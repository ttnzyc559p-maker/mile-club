<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Hanken+Grotesque:wght@400;500;600;700&display=swap');
:root{
  --mist:#E9EFE7; --mist-2:#F1F5EF; --paper:#FBFCFA;
  --pine:#17312A; --pine-2:#43604F; --pine-3:#6E8576;
  --line:#D6E0D3; --line-2:#E4EBE1;
  --gold:#F2A516; --gold-d:#D9890F; --gold-soft:#FBEAC6;
  --teal:#2C8C7F; --clay:#E0694A;
  --shadow:0 1px 2px rgba(23,49,42,.04),0 8px 24px -12px rgba(23,49,42,.18);
}
*{box-sizing:border-box}
html,body{margin:0; padding:0}
body{
  font-family:'Hanken Grotesque',system-ui,sans-serif;
  background:radial-gradient(120% 60% at 50% -10%, #FBF4E2 0%, rgba(251,244,226,0) 55%), var(--mist);
  min-height:100vh; color:var(--pine);
  display:flex; justify-content:center; -webkit-font-smoothing:antialiased;
}
svg{display:block}
.mc-shell{width:100%; max-width:460px; min-height:100vh; position:relative; display:flex; flex-direction:column;
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.35))}
.mc-main{flex:1; padding:0 18px 110px}
.mc-header{display:flex; align-items:center; justify-content:space-between; padding:20px 18px 14px}
.mc-brand{display:flex; align-items:center; gap:8px}
.mc-brand-ico{color:var(--gold-d)}
.mc-brand-name{font-family:'Fraunces',serif; font-weight:600; font-size:18px; letter-spacing:-.01em}
.mc-avatar{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-size:18px; box-shadow:var(--shadow)}
.mc-avatar.xl{width:72px; height:72px; font-size:34px; margin-bottom:6px}
.mc-view{display:flex; flex-direction:column; gap:16px; animation:rise .4s ease both}
@keyframes rise{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
.mc-status{background:var(--paper); border:1px solid var(--line); border-radius:22px; padding:20px; box-shadow:var(--shadow)}
.mc-status.is-done{background:linear-gradient(180deg,#F4FAF3,var(--paper)); border-color:#CDE6CB}
.mc-status-row{display:flex; align-items:center; gap:14px}
.mc-status-ring{width:54px; height:54px; border-radius:50%; display:grid; place-items:center; flex-shrink:0;
  background:var(--gold-soft); color:var(--gold-d); border:2px solid #F4D58C}
.is-done .mc-status-ring{background:#D9F0D6; color:#2E7D32; border-color:#A9DCA6}
.mc-eyebrow{font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--pine-3)}
.mc-status-title{font-family:'Fraunces',serif; font-weight:500; font-size:23px; margin:2px 0 0; letter-spacing:-.01em}
.mc-status-note{margin:14px 0 0; color:var(--pine-2); font-size:14.5px}
.mc-cta{display:inline-flex; align-items:center; gap:4px; background:var(--pine); color:#F5FAF3; border:none; border-radius:14px;
  padding:12px 18px; font-family:inherit; font-weight:600; font-size:15px; cursor:pointer; transition:transform .15s, background .2s; margin-top:16px}
.mc-cta:hover{background:#0F241E; transform:translateY(-1px)}
.mc-cta:active{transform:translateY(0)}
.mc-cta.full{width:100%; justify-content:center; margin-top:20px; padding:15px}
.mc-cta:disabled{opacity:.4; cursor:not-allowed; transform:none}
.mc-trail{background:var(--paper); border:1px solid var(--line); border-radius:22px; padding:20px; box-shadow:var(--shadow)}
.mc-trail-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
.mc-trail-count{display:flex; align-items:baseline; gap:7px; margin-top:2px}
.mc-bignum{font-family:'Fraunces',serif; font-size:52px; font-weight:600; line-height:.9; color:var(--pine); letter-spacing:-.02em}
.mc-bignum-unit{font-size:15px; color:var(--pine-2); font-weight:600}
.mc-flame{color:var(--gold-d); align-self:center}
.mc-trail-target{display:flex; align-items:center; gap:6px; background:var(--mist-2); border:1px solid var(--line-2);
  color:var(--pine-2); font-size:12.5px; padding:7px 11px; border-radius:11px; text-align:right; margin:0}
.mc-trail-target strong{color:var(--pine)}
.mc-trail-empty{color:var(--pine-2); font-size:14px; margin:14px 0 0}
.mc-path{display:flex; flex-wrap:wrap; align-items:center; gap:9px; margin:20px 0 4px; padding:4px 2px}
.mc-mark{width:11px; height:11px; border-radius:50%; background:var(--line); position:relative; transition:all .3s}
.mc-mark::after{content:''; position:absolute; left:100%; top:50%; width:9px; height:2px; transform:translateY(-50%); background:var(--line); border-radius:2px}
.mc-mark:last-of-type::after{display:none}
.mc-mark.on{background:var(--gold); box-shadow:0 0 0 3px var(--gold-soft)}
.mc-mark.on::after{background:var(--gold)}
.mc-mark.tip{background:var(--gold-d); box-shadow:0 0 0 4px rgba(242,165,22,.28); animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(242,165,22,.28)}50%{box-shadow:0 0 0 7px rgba(242,165,22,.08)}}
.mc-path-flag{display:grid; place-items:center; width:26px; height:26px; border-radius:8px; background:var(--pine); color:var(--gold); margin-left:2px}
.mc-longhaul{margin:18px 0 6px}
.mc-longhaul-bar{height:12px; background:var(--mist); border:1px solid var(--line); border-radius:8px; overflow:hidden}
.mc-longhaul-fill{height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-d)); border-radius:8px; transition:width .5s}
.mc-longhaul-meta{display:flex; justify-content:space-between; margin-top:8px; font-size:12px; color:var(--pine-2)}
.mc-longhaul-meta span{display:inline-flex; align-items:center; gap:4px}
.mc-badges{display:flex; gap:8px; margin-top:18px; padding-top:16px; border-top:1px solid var(--line-2)}
.mc-badge{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 4px; border-radius:13px;
  background:var(--mist-2); color:var(--pine-3); border:1px solid var(--line-2)}
.mc-badge.earned{background:var(--gold-soft); color:var(--gold-d); border-color:#F1D38A}
.mc-badge-n{font-size:11px; font-weight:700}
.mc-card{background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:18px; box-shadow:var(--shadow)}
.mc-card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
.mc-card-title{font-family:'Fraunces',serif; font-size:16.5px; font-weight:600; margin:0 0 12px}
.mc-card-head .mc-card-title{margin:0}
.mc-link{display:inline-flex; align-items:center; gap:2px; background:none; border:none; color:var(--teal); font-family:inherit; font-weight:600; font-size:13px; cursor:pointer}
.mc-empty{color:var(--pine-3); font-size:14px; margin:0; line-height:1.5}
.mc-empty.big{text-align:center; padding:40px 20px; font-size:15px}
.mc-glance{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px}
.mc-glance-row{display:flex; align-items:center; gap:9px; font-size:14px}
.mc-dot{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:15px; flex-shrink:0; color:#fff}
.mc-dot.lg{width:40px; height:40px; font-size:19px}
.mc-dot.sm{width:24px; height:24px; font-size:12px}
.mc-glance-name{font-weight:600}
.mc-glance-act{color:var(--pine-2)}
.mc-glance-time{margin-left:auto; color:var(--pine-3); font-size:12px}
.mc-view-head{display:flex; align-items:center; justify-content:space-between; padding:2px 2px 0}
.mc-h2{font-family:'Fraunces',serif; font-size:24px; font-weight:600; margin:8px 0; letter-spacing:-.01em}
.mc-icon-btn{background:var(--paper); border:1px solid var(--line); border-radius:11px; width:36px; height:36px; display:grid; place-items:center; color:var(--pine-2); cursor:pointer}
.mc-spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mc-banner{display:flex; gap:10px; align-items:flex-start; background:var(--gold-soft); border:1px solid #F1D38A; color:#7a5510;
  border-radius:14px; padding:12px 14px; font-size:13px; line-height:1.45}
.mc-feed{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px}
.mc-feedcard{background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:16px; box-shadow:var(--shadow)}
.mc-feed-top{display:flex; align-items:center; gap:11px}
.mc-feed-id{display:flex; flex-direction:column}
.mc-feed-name{font-weight:700; font-size:15px}
.mc-feed-sub{color:var(--pine-2); font-size:13px}
.mc-feed-note{margin:12px 0 0; font-size:14.5px; color:var(--pine); font-style:italic; line-height:1.5}
.mc-feed-actions{display:flex; gap:10px; margin-top:14px}
.mc-react{display:inline-flex; align-items:center; gap:6px; background:var(--mist-2); border:1px solid var(--line-2);
  color:var(--pine-2); border-radius:11px; padding:7px 12px; font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; transition:all .15s}
.mc-react:hover{border-color:var(--line)}
.mc-react.on{background:#FBE4DD; color:var(--clay); border-color:#F3C8BD}
.mc-comments{margin-top:14px; padding-top:14px; border-top:1px solid var(--line-2); display:flex; flex-direction:column; gap:11px}
.mc-comment{display:flex; gap:8px; align-items:flex-start}
.mc-comment-name{font-weight:700; font-size:13px; margin-right:6px}
.mc-comment-text{font-size:13.5px; color:var(--pine-2)}
.mc-comment-input{display:flex; gap:8px; align-items:center}
.mc-comment-input input{flex:1; border:1px solid var(--line); background:var(--mist-2); border-radius:11px; padding:10px 12px; font-family:inherit; font-size:14px; color:var(--pine)}
.mc-comment-input input:focus{outline:2px solid var(--gold); outline-offset:1px; border-color:transparent}
.mc-comment-input button{background:var(--pine); color:#F5FAF3; border:none; border-radius:11px; width:38px; height:38px; display:grid; place-items:center; cursor:pointer}
.mc-comment-input button:disabled{opacity:.35}
.mc-profile{display:flex; flex-direction:column; align-items:center; text-align:center; padding:10px 0 6px}
.mc-profile .mc-h2{margin:2px 0 12px}
.mc-profile-stats{display:flex; gap:6px; width:100%}
.mc-profile-stats>div{flex:1; background:var(--paper); border:1px solid var(--line); border-radius:15px; padding:13px 6px; display:flex; flex-direction:column; box-shadow:var(--shadow)}
.mc-stat-n{font-family:'Fraunces',serif; font-size:26px; font-weight:600; line-height:1}
.mc-stat-l{font-size:11px; color:var(--pine-3); margin-top:4px; text-transform:uppercase; letter-spacing:.06em; font-weight:600}
.mc-heat{display:flex; gap:4px; justify-content:space-between}
.mc-heat-col{display:flex; flex-direction:column; gap:4px; flex:1}
.mc-heat-cell{aspect-ratio:1; border-radius:3px; background:var(--mist); border:1px solid var(--line-2)}
.mc-heat-cell.on{background:var(--gold); border-color:var(--gold-d)}
.mc-heat-cell.fut{opacity:.4}
.mc-miles-list{display:flex; flex-direction:column; gap:2px}
.mc-mile-row{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line-2)}
.mc-mile-row:last-child{border-bottom:none}
.mc-mile-ico{width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:var(--mist-2); color:var(--pine-3)}
.mc-mile-row.got .mc-mile-ico{background:var(--gold-soft); color:var(--gold-d)}
.mc-mile-txt{display:flex; flex-direction:column; flex:1}
.mc-mile-txt strong{font-size:14.5px}
.mc-mile-txt span{font-size:12px; color:var(--pine-3)}
.mc-mile-check{color:var(--teal)}
.mc-mile-lock{color:var(--line); font-weight:700}
.mc-toggle{width:46px; height:27px; border-radius:14px; background:var(--line); border:none; position:relative; cursor:pointer; transition:background .2s; flex-shrink:0}
.mc-toggle.on{background:var(--teal)}
.mc-toggle-knob{position:absolute; top:3px; left:3px; width:21px; height:21px; border-radius:50%; background:#fff; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.2)}
.mc-toggle.on .mc-toggle-knob{transform:translateX(19px)}
.mc-reminder-body{display:flex; align-items:center; gap:10px; color:var(--pine-2); margin-top:4px}
.mc-time{border:1px solid var(--line); background:var(--mist-2); border-radius:10px; padding:8px 10px; font-family:inherit; font-size:14px; color:var(--pine)}
.mc-fineprint{font-size:12px; color:var(--pine-3); line-height:1.5; margin:12px 0 0}
.mc-nav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:460px;
  display:flex; align-items:center; justify-content:space-around; padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:rgba(251,252,250,.9); backdrop-filter:blur(12px); border-top:1px solid var(--line)}
.mc-nav>button{background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--pine-3); font-family:inherit; font-size:11px; font-weight:600; cursor:pointer; padding:4px 14px; transition:color .2s}
.mc-nav>button.on{color:var(--pine)}
.mc-nav-log{padding:0}
.mc-nav-fab{display:grid; place-items:center; width:54px; height:54px; border-radius:50%; margin-top:-26px;
  background:var(--gold); color:var(--pine); box-shadow:0 6px 18px -4px rgba(242,165,22,.6); transition:transform .15s, background .2s}
.mc-nav-log:hover .mc-nav-fab{transform:translateY(-2px)}
.mc-nav-fab.done{background:#D9F0D6; color:#2E7D32}
.mc-overlay{position:fixed; inset:0; background:rgba(23,49,42,.4); backdrop-filter:blur(2px); display:flex; align-items:flex-end; justify-content:center; z-index:50; animation:fade .25s ease}
.mc-overlay.celebrate{align-items:center}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mc-sheet{width:100%; max-width:460px; background:var(--paper); border-radius:26px 26px 0 0; padding:10px 22px calc(28px + env(safe-area-inset-bottom)); animation:slideup .3s cubic-bezier(.2,.8,.2,1)}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.mc-sheet-grab{width:40px; height:4px; border-radius:2px; background:var(--line); margin:6px auto 16px}
.mc-sheet-title{font-family:'Fraunces',serif; font-size:21px; font-weight:600; margin:0 0 18px}
.mc-seg{display:flex; gap:6px; background:var(--mist-2); padding:5px; border-radius:14px; border:1px solid var(--line-2)}
.mc-seg button{flex:1; border:none; background:none; padding:11px; border-radius:10px; font-family:inherit; font-weight:600; font-size:15px; color:var(--pine-3); cursor:pointer; transition:all .18s}
.mc-seg button.on{background:var(--paper); color:var(--pine); box-shadow:var(--shadow)}
.mc-field-label{display:block; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--pine-3); margin:20px 0 9px}
.mc-dist{display:flex; align-items:center; gap:10px}
.mc-dist button{width:48px; height:48px; border-radius:13px; border:1px solid var(--line); background:var(--mist-2); font-size:24px; color:var(--pine); cursor:pointer; line-height:1}
.mc-dist input{flex:1; text-align:center; font-family:'Fraunces',serif; font-size:32px; font-weight:600; border:1px solid var(--line); border-radius:13px; padding:8px; color:var(--pine); background:#fff; width:100%}
.mc-dist input:focus, .mc-note-input:focus{outline:2px solid var(--gold); outline-offset:1px; border-color:transparent}
.mc-warn{color:var(--clay); font-size:13px; margin:9px 0 0; font-weight:500}
.mc-note-input{width:100%; border:1px solid var(--line); border-radius:13px; padding:13px 14px; font-family:inherit; font-size:15px; color:var(--pine); background:#fff}
.mc-celebrate{background:var(--paper); border-radius:26px; padding:34px 30px; text-align:center; max-width:320px; width:88%; animation:pop .4s cubic-bezier(.2,1.2,.3,1)}
@keyframes pop{from{transform:scale(.85); opacity:0}to{transform:none; opacity:1}}
.mc-celebrate-spark{color:var(--gold-d); display:flex; justify-content:center; margin-bottom:6px}
.mc-celebrate-big{font-family:'Fraunces',serif; font-size:68px; font-weight:600; color:var(--gold-d); line-height:1}
.mc-celebrate-name{font-family:'Fraunces',serif; font-size:22px; font-weight:600; margin:6px 0 6px}
.mc-celebrate-sub{color:var(--pine-2); font-size:14px; margin:0 0 22px; line-height:1.5}
.mc-toast{position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--pine); color:#F5FAF3;
  padding:12px 18px; border-radius:13px; font-size:13.5px; font-weight:500; z-index:60; max-width:90%; text-align:center; box-shadow:var(--shadow)}
.mc-onboard{justify-content:center; padding:30px 22px; gap:24px; display:flex; flex-direction:column}
.mc-onboard-hero{text-align:center; color:var(--pine)}
.mc-onboard-hero svg{color:var(--gold-d); margin:0 auto}
.mc-onboard-title{font-family:'Fraunces',serif; font-size:32px; font-weight:600; margin:10px 0 8px; letter-spacing:-.02em}
.mc-onboard-tag{color:var(--pine-2); font-size:15px; line-height:1.5; max-width:300px; margin:0 auto}
.mc-onboard-card{background:var(--paper); border:1px solid var(--line); border-radius:24px; padding:22px; box-shadow:var(--shadow)}
.mc-onboard-card .mc-field-label:first-child{margin-top:0}
.mc-swatches{display:flex; gap:10px; flex-wrap:wrap}
.mc-swatch{width:40px; height:40px; border-radius:50%; border:3px solid transparent; cursor:pointer; transition:transform .15s}
.mc-swatch.on{border-color:var(--pine); transform:scale(1.08)}
.mc-emojis{display:flex; gap:8px; flex-wrap:wrap}
.mc-emoji{width:44px; height:44px; border-radius:13px; border:1px solid var(--line); background:var(--mist-2); font-size:22px; cursor:pointer; transition:all .15s}
.mc-emoji.on{background:var(--gold-soft); border-color:var(--gold); transform:scale(1.05)}
.mc-splash{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--pine-3)}
.mc-splash span{font-family:'Fraunces',serif; font-size:18px}
.mc-splash svg{color:var(--gold-d); animation:pulse2 1.4s ease-in-out infinite; margin:0 auto}
@keyframes pulse2{0%,100%{opacity:.4}50%{opacity:1}}
button:focus-visible, input:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important; transition-duration:.001ms!important}}
</style>
</head>

};
const ic = (name, size=20) => P(ICONS[name]).replace('width="24" height="24"', `width="${size}" height="${size}"`);

/* ---------- date helpers ---------- */
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => ymd(new Date());
const shift = (s,n) => { const [y,m,dd]=s.split('-').map(Number); const d=new Date(y,m-1,dd); d.setDate(d.getDate()+n); return ymd(d); };
const prettyDate = s => { if(s===today())return"Today"; if(s===shift(today(),-1))return"Yesterday";
  const [y,m,dd]=s.split('-').map(Number); return new Date(y,m-1,dd).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); };
const sinceLabel = ts => { const s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return"just now"; if(s<3600)return Math.floor(s/60)+"m ago"; if(s<86400)return Math.floor(s/3600)+"h ago"; return Math.floor(s/86400)+"d ago"; };
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- streak + milestones ---------- */
const valid = e => e && e.distance >= 1;
const MILES = [
  {n:7,name:"First Week",sub:"7 days",icon:"sun"},
  {n:30,name:"A Full Month",sub:"30 days",icon:"flame"},
  {n:90,name:"A Whole Season",sub:"90 days",icon:"mtn"},
  {n:180,name:"Half a Year",sub:"180 days",icon:"mtn"},
  {n:365,name:"A Year of Miles",sub:"365 days",icon:"flag"},
];
function computeStreak(days){ if(!days)return 0; let s=0,c=today(); if(!valid(days[c]))c=shift(c,-1); while(valid(days[c])){s++;c=shift(c,-1);} return s; }
const nextMile = s => MILES.find(m=>m.n>s) || null;
const prevMile = s => { let r=0; for(const m of MILES) if(m.n<=s) r=m.n; return r; };
function bestEver(days){ const ds=Object.keys(days||{}).filter(d=>valid(days[d])).sort(); let best=0,run=0,prev=null;
  for(const d of ds){ if(prev && shift(prev,1)===d) run++; else run=1; best=Math.max(best,run); prev=d; } return Math.max(best,computeStreak(days)); }
const badgeIcon = k => k==="sun"?ic("sun",15):k==="flame"?ic("flame",15):k==="mtn"?ic("mtn",15):ic("flag",15);

/* ---------- identity options ---------- */
const COLORS=["#2C8C7F","#F2A516","#E0694A","#6C7FD6","#8A5BB8","#3E7C45","#D6517E","#C98A2B"];
const EMOJI=["🏃","🚶","🥾","🌅","🐕","🌲","⛰️","☀️","🍃","🏔️","🐾","🌻"];

/* ================= data layer ================= */
const LS = {
  get(k,f){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):f; }catch{ return f; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }
};

const Store = {
  mode: "local",
  me: null,                 // {id,name,color,emoji,reminderOn,reminderTime}
  members: {},              // id -> {profile:{name,color,emoji}, days:{date:{type,distance,note,ts,kudos:[],comments:[]}}}
  db: null,
  ready: false,

  async init(){
    this.me = LS.get("mileclub:me", null);
    if (FIREBASE_CONFIG){
      try {
        await loadFirebase();
        firebase.initializeApp(FIREBASE_CONFIG);
        this.db = firebase.firestore();
        this.mode = "cloud";
        this.db.collection("members").onSnapshot(snap=>{
          const m={}; snap.forEach(doc=>{ m[doc.id]=doc.data(); });
          this.members=m; rerender();
        }, err=>{ console.warn("Firestore listen failed:",err); });
        if (this.me) await this._ensureProfile();
      } catch(e){
        console.warn("Firebase unavailable, falling back to solo mode:", e);
        this.mode="local"; this._loadLocal();
      }
    } else { this.mode="local"; this._loadLocal(); }
  },
  _loadLocal(){
    if(this.me){ const days=LS.get("mileclub:days:"+this.me.id,{});
      this.members={ [this.me.id]:{ profile:{name:this.me.name,color:this.me.color,emoji:this.me.emoji}, days } }; }
  },
  myDays(){ return (this.members[this.me?.id]||{}).days || {}; },

  async createMe(profile){
    const id="u_"+Math.random().toString(36).slice(2,9);
    this.me={ id, ...profile, reminderOn:false, reminderTime:"07:30" };
    LS.set("mileclub:me", this.me);
    if(this.mode==="cloud") await this._ensureProfile();
    else this._loadLocal();
  },
  saveMe(){ LS.set("mileclub:me", this.me); },
  async _ensureProfile(){
    const ref=this.db.collection("members").doc(this.me.id);
    await ref.set({ profile:{name:this.me.name,color:this.me.color,emoji:this.me.emoji}, updatedAt:Date.now() }, {merge:true});
  },

  async logDay({type,distance,note}){
    const date=today(); const ts=Date.now();
    if(this.mode==="cloud"){
      const ref=this.db.collection("members").doc(this.me.id);
      const existing=this.myDays()[date];
      const day={ type, distance, note:note||"", ts, kudos: existing?.kudos||[], comments: existing?.comments||[] };
      await ref.set({ days:{ [date]: day } }, {merge:true});
    } else {
      const days=this.myDays(); const existing=days[date];
      days[date]={ type, distance, note:note||"", ts, kudos: existing?.kudos||[], comments: existing?.comments||[] };
      LS.set("mileclub:days:"+this.me.id, days);
      this.members[this.me.id].days=days;
    }
  },

  async toggleKudos(id,date){
    if(this.mode==="cloud"){
      const ref=this.db.collection("members").doc(id);
      const cur=(this.members[id]?.days?.[date]?.kudos)||[];
      const has=cur.includes(this.me.id);
      const fv=firebase.firestore.FieldValue;
      await ref.update({ ["days."+date+".kudos"]: has?fv.arrayRemove(this.me.id):fv.arrayUnion(this.me.id) });
    } else {
      const day=this.members[id].days[date]; const cur=day.kudos||[]; const has=cur.includes(this.me.id);
      day.kudos = has?cur.filter(x=>x!==this.me.id):[...cur,this.me.id];
      LS.set("mileclub:days:"+id, this.members[id].days); rerender();
    }
  },

  async addComment(id,date,text){
    const c={ byId:this.me.id, byName:this.me.name, byColor:this.me.color, byEmoji:this.me.emoji, text, ts:Date.now() };
    if(this.mode==="cloud"){
      const ref=this.db.collection("members").doc(id);
      await ref.update({ ["days."+date+".comments"]: firebase.firestore.FieldValue.arrayUnion(c) });
    } else {
      const day=this.members[id].days[date]; day.comments=[...(day.comments||[]),c];
      LS.set("mileclub:days:"+id, this.members[id].days); rerender();
    }
  }
};

function loadFirebase(){
  return new Promise((res,rej)=>{
    const base="https://www.gstatic.com/firebasejs/10.12.0/";
    const a=document.createElement("script"); a.src=base+"firebase-app-compat.js";
    a.onload=()=>{ const b=document.createElement("script"); b.src=base+"firebase-firestore-compat.js";
      b.onload=res; b.onerror=rej; document.head.appendChild(b); };
    a.onerror=rej; document.head.appendChild(a);
  });
}

/* ================= app state / render ================= */
const state = { view:"today", openComments:{} };
let reminderTimer=null;

function flash(msg){ const t=document.getElementById("toast");
  t.innerHTML=`<div class="mc-toast">${esc(msg)}</div>`; setTimeout(()=>{ t.innerHTML=""; }, 2600); }

function feedEntries(){
  const out=[];
  Object.entries(Store.members).forEach(([id,m])=>{
    Object.entries(m.days||{}).forEach(([date,e])=>{ if(valid(e)) out.push({id,date,...e,profile:m.profile||{}}); });
  });
  out.sort((a,b)=>(b.ts||0)-(a.ts||0));
  return out;
}

function rerender(){
  // preserve focus in a comment input across re-render
  const active=document.activeElement;
  let restore=null;
  if(active && active.dataset && active.dataset.cmt){ restore={key:active.dataset.cmt, val:active.value, pos:active.selectionStart}; }
  render();
  if(restore){ const el=document.querySelector(`input[data-cmt="${restore.key}"]`);
    if(el){ el.value=restore.val; el.focus(); try{ el.setSelectionRange(restore.pos,restore.pos); }catch{} } }
}

function render(){
  const app=document.getElementById("app");
  if(!Store.ready){ app.innerHTML=`<div class="mc-splash">${ic("foot",28)}<span>the mile club</span></div>`; return; }
  if(!Store.me){ app.innerHTML=renderOnboard(); return; }

  const days=Store.myDays();
  const streak=computeStreak(days);
  const loggedToday=valid(days[today()]);
  let body="";
  if(state.view==="today") body=renderToday(days,streak,loggedToday);
  else if(state.view==="group") body=renderGroup();
  else body=renderYou(days,streak);

  app.innerHTML=`<div class="mc-shell">
    <header class="mc-header">
      <div class="mc-brand"><span class="mc-brand-ico">${ic("foot",20)}</span><span class="mc-brand-name">the mile club</span></div>
      <div class="mc-avatar" style="background:${esc(Store.me.color)}">${Store.me.emoji}</div>
    </header>
    <main class="mc-main">${body}</main>
    ${renderNav(loggedToday)}
  </div>`;
}

function renderToday(days,streak,loggedToday){
  const t=days[today()];
  const recent=feedEntries().filter(e=>e.id!==Store.me.id).slice(0,3);
  let glance;
  if(recent.length===0) glance=`<p class="mc-empty">${Store.mode==="local"?"You're in solo mode. Turn on sharing to see your circle here.":"No one else has logged yet. Be the one who starts the trail."}</p>`;
  else glance=`<ul class="mc-glance">${recent.map(e=>`<li class="mc-glance-row">
      <span class="mc-dot" style="background:${esc(e.profile.color||'#999')}">${e.profile.emoji||''}</span>
      <span class="mc-glance-name">${esc(e.profile.name||'Someone')}</span>
      <span class="mc-glance-act">${e.type==='run'?'ran':'walked'} ${e.distance} mi</span>
      <span class="mc-glance-time">${sinceLabel(e.ts)}</span></li>`).join("")}</ul>`;

  return `<div class="mc-view">
    <section class="mc-status ${loggedToday?'is-done':''}">
      <div class="mc-status-row">
        <div class="mc-status-ring">${loggedToday?ic("check",26):ic("foot",24)}</div>
        <div><div class="mc-eyebrow">${prettyDate(today())}</div>
        <h2 class="mc-status-title">${loggedToday?"Mile done.":"Your mile is waiting."}</h2></div>
      </div>
      ${loggedToday
        ? `<p class="mc-status-note">${t.type==='run'?'Ran':'Walked'} ${t.distance} mi${t.note?` · "${esc(t.note)}"`:''}</p>`
        : `<button class="mc-cta" data-act="log-open">Log my mile ${ic("chevR",18)}</button>`}
    </section>
    ${renderTrail(streak)}
    <section class="mc-card">
      <div class="mc-card-head"><h3 class="mc-card-title">The group today</h3>
        <button class="mc-link" data-act="view-group">See all ${ic("chevR",14)}</button></div>
      ${glance}
    </section>
  </div>`;
}

function renderTrail(streak){
  const next=nextMile(streak), prev=prevMile(streak);
  const target=next?next.n:streak, legLen=target-prev, done=streak-prev;
  const dots=legLen>0 && legLen<=31;
  let path;
  if(streak===0){ path=`<p class="mc-trail-empty">Walk or run a mile today to set out. The trail starts with one marker.</p>`; }
  else if(dots){
    let m=""; for(let i=0;i<legLen;i++){ const f=i<done,last=i===done-1; m+=`<span class="mc-mark ${f?'on':''} ${last?'tip':''}"></span>`; }
    path=`<div class="mc-path">${m}<span class="mc-path-flag">${ic("flag",16)}</span></div>`;
  } else {
    const pct=Math.min(100,(done/legLen)*100);
    path=`<div class="mc-longhaul"><div class="mc-longhaul-bar"><div class="mc-longhaul-fill" style="width:${pct}%"></div></div>
      <div class="mc-longhaul-meta"><span>${prev} ${ic("flag",11)}</span><span>${next?next.name+' · '+next.n:'beyond a year'} ${ic("flag",11)}</span></div></div>`;
  }
  const badges=MILES.map(m=>`<div class="mc-badge ${streak>=m.n?'earned':''}" title="${m.name} — ${m.sub}">
    <span>${badgeIcon(m.icon)}</span><span class="mc-badge-n">${m.n}</span></div>`).join("");
  return `<section class="mc-trail">
    <div class="mc-trail-head">
      <div><div class="mc-eyebrow">Current streak</div>
        <div class="mc-trail-count"><span class="mc-bignum">${streak}</span>
        <span class="mc-bignum-unit">${streak===1?'day':'days'}</span>${streak>0?`<span class="mc-flame">${ic("flame",20)}</span>`:''}</div></div>
      ${next?`<div class="mc-trail-target">${ic("flag",15)}<span>${next.n-streak} to <strong>${next.name}</strong></span></div>`:''}
    </div>
    ${path}
    <div class="mc-badges">${badges}</div>
  </section>`;
}

function renderGroup(){
  const entries=feedEntries();
  const banner=Store.mode==="local"
    ? `<div class="mc-banner">${ic("users",18)}<div>You're in solo mode — only your own miles show here. Add a Firebase config to the file to share with your circle.</div></div>` : "";
  let feed;
  if(entries.length===0) feed=`<p class="mc-empty big">No miles logged yet. The first marker on the trail is yours to plant.</p>`;
  else feed=`<ul class="mc-feed">${entries.map(renderFeedCard).join("")}</ul>`;
  return `<div class="mc-view">
    <div class="mc-view-head"><h2 class="mc-h2">The trail log</h2>
      <button class="mc-icon-btn" data-act="refresh" aria-label="Refresh">${ic("refresh",16)}</button></div>
    ${banner}${feed}
  </div>`;
}

function renderFeedCard(e){
  const key=e.id+"__"+e.date;
  const kudos=e.kudos||[], comments=e.comments||[];
  const liked=kudos.includes(Store.me.id);
  const open=state.openComments[key];
  const commentsHtml=open?`<div class="mc-comments">
    ${comments.map(c=>`<div class="mc-comment"><span class="mc-dot sm" style="background:${esc(c.byColor||'#999')}">${c.byEmoji||''}</span>
      <div><span class="mc-comment-name">${esc(c.byName)}</span><span class="mc-comment-text">${esc(c.text)}</span></div></div>`).join("")}
    <div class="mc-comment-input">
      <input data-cmt="${key}" placeholder="Say something kind…" />
      <button data-act="comment-send" data-key="${key}" aria-label="Send">${ic("send",15)}</button>
    </div></div>`:"";
  return `<li class="mc-feedcard">
    <div class="mc-feed-top"><span class="mc-dot lg" style="background:${esc(e.profile.color||'#999')}">${e.profile.emoji||''}</span>
      <div class="mc-feed-id"><span class="mc-feed-name">${esc(e.profile.name||'Someone')}</span>
        <span class="mc-feed-sub">${e.type==='run'?'Ran':'Walked'} ${e.distance} mi · ${prettyDate(e.date)}</span></div></div>
    ${e.note?`<p class="mc-feed-note">"${esc(e.note)}"</p>`:''}
    <div class="mc-feed-actions">
      <button class="mc-react ${liked?'on':''}" data-act="kudos" data-key="${key}">${ic("heart",15)} ${kudos.length||''} <span>Cheer</span></button>
      <button class="mc-react" data-act="toggle-comments" data-key="${key}">${ic("msg",15)} ${comments.length||''} <span>Comment</span></button>
    </div>${commentsHtml}</li>`;
}

function renderYou(days,streak){
  const best=bestEver(days);
  const valids=Object.values(days).filter(valid);
  const totalMiles=valids.reduce((s,e)=>s+e.distance,0);
  const totalDays=valids.length;
  return `<div class="mc-view">
    <div class="mc-profile">
      <div class="mc-avatar xl" style="background:${esc(Store.me.color)}">${Store.me.emoji}</div>
      <h2 class="mc-h2">${esc(Store.me.name)}</h2>
      <div class="mc-profile-stats">
        <div><span class="mc-stat-n">${streak}</span><span class="mc-stat-l">streak</span></div>
        <div><span class="mc-stat-n">${best}</span><span class="mc-stat-l">best</span></div>
        <div><span class="mc-stat-n">${totalDays}</span><span class="mc-stat-l">days</span></div>
        <div><span class="mc-stat-n">${totalMiles.toFixed(0)}</span><span class="mc-stat-l">miles</span></div>
      </div>
    </div>
    <section class="mc-card"><h3 class="mc-card-title">Last 12 weeks</h3>${renderHeatmap(days)}</section>
    <section class="mc-card"><h3 class="mc-card-title">Markers earned</h3>
      <div class="mc-miles-list">${MILES.map(m=>{const got=best>=m.n;return `<div class="mc-mile-row ${got?'got':''}">
        <span class="mc-mile-ico">${badgeIcon(m.icon)}</span>
        <div class="mc-mile-txt"><strong>${m.name}</strong><span>${m.sub}</span></div>
        ${got?`<span class="mc-mile-check">${ic("check",18)}</span>`:'<span class="mc-mile-lock">—</span>'}</div>`;}).join("")}</div>
    </section>
    <section class="mc-card">
      <div class="mc-card-head"><h3 class="mc-card-title">Daily reminder</h3>
        <button class="mc-toggle ${Store.me.reminderOn?'on':''}" data-act="reminder-toggle" aria-pressed="${Store.me.reminderOn}"><span class="mc-toggle-knob"></span></button></div>
      <div class="mc-reminder-body">${Store.me.reminderOn?ic("bell",16):ic("bellOff",16)}
        <input type="time" class="mc-time" value="${Store.me.reminderTime}" data-act="reminder-time" /></div>
      <p class="mc-fineprint">Reminders fire while this app is open in your browser. To get nudged when it's closed, add it to your home screen and allow notifications.</p>
    </section>

}

function renderHeatmap(days){
  const cols=12; const start=shift(today(),-(cols*7-1));
  const [sy,sm,sd]=start.split('-').map(Number); const sdt=new Date(sy,sm-1,sd); sdt.setDate(sdt.getDate()-sdt.getDay());
  let out="";
  for(let w=0;w<cols;w++){ let col="";
    for(let d=0;d<7;d++){ const cur=new Date(sdt); cur.setDate(cur.getDate()+w*7+d); const k=ymd(cur);
      const on=valid(days[k]), fut=k>today(); col+=`<span class="mc-heat-cell ${on?'on':''} ${fut?'fut':''}" title="${k}"></span>`; }
    out+=`<div class="mc-heat-col">${col}</div>`; }
  return `<div class="mc-heat">${out}</div>`;
}

  const tab=(v,icon,label)=>`<button class="${state.view===v?'on':''}" data-act="view-${v}">${ic(icon,20)}<span>${label}</span></button>`;
  return `<nav class="mc-nav">
    ${tab("today","home","Today")}

      <span class="mc-nav-fab ${loggedToday?'done':''}">${loggedToday?ic("check",22):ic("plus",24)}</span></button>
    ${tab("group","users","Group")}
    ${tab("you","user","You")}
  </nav>`;
}

function renderOnboard(){
  return `<div class="mc-shell mc-onboard">
    <div class="mc-onboard-hero">${ic("foot",30)}<h1 class="mc-onboard-title">the mile club</h1>
      <p class="mc-onboard-tag">One mile a day, together. Walk it or run it — just show up.</p></div>
    <div class="mc-onboard-card">
      <label class="mc-field-label">What should the group call you?</label>
      <input class="mc-note-input" id="ob-name" maxlength="24" placeholder="Your name" />
      <label class="mc-field-label">Pick a color</label>
      <div class="mc-swatches">${COLORS.map((c,i)=>`<button class="mc-swatch ${i===0?'on':''}" data-act="ob-color" data-c="${c}" style="background:${c}" aria-label="color"></button>`).join("")}</div>
      <label class="mc-field-label">Pick a marker</label>
      <div class="mc-emojis">${EMOJI.map((e,i)=>`<button class="mc-emoji ${i===0?'on':''}" data-act="ob-emoji" data-e="${e}">${e}</button>`).join("")}</div>
      <button class="mc-cta full" data-act="ob-done">Set out ${ic("chevR",18)}</button>
    </div>
  </div>`;
}

/* ================= overlays ================= */
let sheet={type:"walk",dist:1};
function openLog(){
  const ex=Store.myDays()[today()];
  sheet={ type:ex?.type||"walk", dist:ex?.distance||1, note:ex?.note||"" };
  const ov=document.getElementById("overlay");
  ov.innerHTML=`<div class="mc-overlay" data-act="sheet-bg"><div class="mc-sheet" id="sheet">
    <div class="mc-sheet-grab"></div>
    <h3 class="mc-sheet-title">Log today's mile</h3>
    <div class="mc-seg"><button id="seg-walk" class="${sheet.type==='walk'?'on':''}" data-act="seg" data-t="walk">Walk</button>
      <button id="seg-run" class="${sheet.type==='run'?'on':''}" data-act="seg" data-t="run">Run</button></div>
    <label class="mc-field-label">Distance (miles)</label>
    <div class="mc-dist"><button data-act="dist" data-d="-1">–</button>
      <input id="dist" inputmode="decimal" value="${sheet.dist}" />
      <button data-act="dist" data-d="1">+</button></div>
    <p class="mc-warn" id="warn" style="display:${sheet.dist<1?'block':'none'}">It takes a full mile to keep the streak.</p>
    <label class="mc-field-label">A note (optional)</label>
    <input class="mc-note-input" id="note" maxlength="120" value="${esc(sheet.note||'')}" placeholder="Sunrise loop, took the dog…" />
    <button class="mc-cta full" data-act="log-save">${ex?'Update':'Plant my marker'}</button>
  </div></div>`;
}
function closeOverlay(){ document.getElementById("overlay").innerHTML=""; }

function celebrate(m,streak){
  document.getElementById("overlay").innerHTML=`<div class="mc-overlay celebrate" data-act="celebrate-close">
    <div class="mc-celebrate"><div class="mc-celebrate-spark">${ic("spark",28)}</div>
      <div class="mc-celebrate-big">${streak}</div><h3 class="mc-celebrate-name">${m.name}</h3>
      <p class="mc-celebrate-sub">You've reached a ${m.sub} streak. Marker planted.</p>
      <button class="mc-cta" data-act="celebrate-close">Keep going ${ic("chevR",18)}</button></div></div>`;
}

/* ================= reminders ================= */
function scheduleReminder(){
  if(reminderTimer) clearTimeout(reminderTimer);
  if(!Store.me || !Store.me.reminderOn || !Store.me.reminderTime) return;
  const [h,mn]=Store.me.reminderTime.split(":").map(Number);
  const now=new Date(), next=new Date(); next.setHours(h,mn,0,0); if(next<=now) next.setDate(next.getDate()+1);
  reminderTimer=setTimeout(()=>{
    if(valid(Store.myDays()[today()])) return;
    if(typeof Notification!=="undefined" && Notification.permission==="granted"){
      try{ new Notification("The Mile Club",{body:"Your mile is waiting. Keep the streak alive."}); }catch{}
    } else flash("Reminder: your mile is waiting today.");
    scheduleReminder();
  }, next-now);
}

/* ================= events ================= */
let obSel={color:COLORS[0],emoji:EMOJI[0]};

document.addEventListener("click", async (ev)=>{
  const el=ev.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act;

  if(act==="log-open"){ openLog(); return; }
  if(act==="sheet-bg" && ev.target===el){ closeOverlay(); return; }
  if(act==="celebrate-close"){ closeOverlay(); return; }
  if(act==="seg"){ sheet.type=el.dataset.t;
    document.getElementById("seg-walk").classList.toggle("on",sheet.type==="walk");
    document.getElementById("seg-run").classList.toggle("on",sheet.type==="run"); return; }
  if(act==="dist"){ const inp=document.getElementById("dist");
    let v=(parseFloat(inp.value)||0)+ (el.dataset.d==="1"?0.25:-0.25); v=Math.max(0,v);
    inp.value=v.toFixed(2).replace(/\.00$/,""); document.getElementById("warn").style.display=v<1?"block":"none"; return; }
  if(act==="log-save"){
    const dist=parseFloat(document.getElementById("dist").value)||0;
    const note=document.getElementById("note").value;
    const before=computeStreak(Store.myDays());
    await Store.logDay({type:sheet.type,distance:dist,note});
    closeOverlay();
    const after=computeStreak(Store.myDays());
    const hit=MILES.find(m=>m.n===after && before<m.n);
    if(Store.mode==="local") rerender();
    if(hit) celebrate(hit,after);
    else flash(dist>=1?"Marker planted. Streak's alive.":"Logged — but it takes a full mile to count.");
    return;
  }

  if(act==="view-today"){ state.view="today"; rerender(); return; }
  if(act==="view-group"){ state.view="group"; rerender(); return; }
  if(act==="view-you"){ state.view="you"; rerender(); return; }
  if(act==="refresh"){ const i=el.querySelector("svg"); if(i)i.classList.add("mc-spin"); setTimeout(()=>rerender(),400); return; }

  if(act==="kudos"){ const [id,date]=el.dataset.key.split("__"); await Store.toggleKudos(id,date); return; }
  if(act==="toggle-comments"){ state.openComments[el.dataset.key]=!state.openComments[el.dataset.key]; rerender(); return; }
  if(act==="comment-send"){
    const inp=document.querySelector(`input[data-cmt="${el.dataset.key}"]`); const text=(inp.value||"").trim();
    if(!text) return; const [id,date]=el.dataset.key.split("__"); inp.value="";
    await Store.addComment(id,date,text); return;
  }

  if(act==="reminder-toggle"){ Store.me.reminderOn=!Store.me.reminderOn; Store.saveMe();
    if(Store.me.reminderOn && typeof Notification!=="undefined" && Notification.permission==="default"){ try{ await Notification.requestPermission(); }catch{} }
    scheduleReminder(); rerender(); return; }

  if(act==="ob-color"){ obSel.color=el.dataset.c;
    document.querySelectorAll('[data-act="ob-color"]').forEach(b=>b.classList.toggle("on",b===el)); return; }
  if(act==="ob-emoji"){ obSel.emoji=el.dataset.e;
    document.querySelectorAll('[data-act="ob-emoji"]').forEach(b=>b.classList.toggle("on",b===el)); return; }
  if(act==="ob-done"){
    const name=(document.getElementById("ob-name").value||"").trim();
    if(!name){ document.getElementById("ob-name").focus(); flash("Add a name to set out."); return; }
    await Store.createMe({name,color:obSel.color,emoji:obSel.emoji}); rerender(); scheduleReminder(); return;
  }
});

document.addEventListener("keydown",(ev)=>{
  if(ev.key==="Enter" && ev.target.dataset && ev.target.dataset.cmt){
    const key=ev.target.dataset.cmt; const btn=document.querySelector(`[data-act="comment-send"][data-key="${key}"]`); if(btn) btn.click();
  }
});
document.addEventListener("change",(ev)=>{
  const el=ev.target.closest("[data-act]"); if(!el) return;
  if(el.dataset.act==="reminder-time"){ Store.me.reminderTime=el.value; Store.saveMe(); scheduleReminder(); }
});

/* ================= boot ================= */
(async function(){
  await Store.init();
  Store.ready=true;
  render();
  scheduleReminder();
})();

})();
</script>
</body>
</html>
