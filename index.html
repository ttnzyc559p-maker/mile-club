<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#E4EDE1" />
<title>The Mile Club</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Hanken+Grotesque:wght@400;500;600;700&display=swap');
:root{
  --mist:#E4EDE1; --mist-2:#EEF4EB; --paper:#FAFCF9;
  --pine:#14302A; --pine-2:#3E5E50; --pine-3:#698272;
  --line:#CDD9CA; --line-2:#DDE8DA;
  --gold:#F0A30E; --gold-d:#D4820A; --gold-soft:#FDECC5;
  --teal:#267D72; --clay:#D95F3A;
  --shadow-sm:0 1px 3px rgba(20,48,42,.06);
  --shadow:0 2px 4px rgba(20,48,42,.05),0 8px 28px -8px rgba(20,48,42,.16);
  --shadow-lg:0 4px 8px rgba(20,48,42,.06),0 16px 40px -12px rgba(20,48,42,.22);
  --r-card:22px; --r-btn:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Hanken Grotesque',system-ui,sans-serif;
  background:
    radial-gradient(ellipse 90% 50% at 50% -5%, #F9F1DC 0%, transparent 65%),
    radial-gradient(ellipse 60% 40% at 100% 100%, #DCF0E8 0%, transparent 55%),
    var(--mist);
  min-height:100vh; color:var(--pine);
  display:flex; justify-content:center;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
svg{display:block;flex-shrink:0}

/* ── shell ── */
.mc-shell{
  width:100%; max-width:460px; min-height:100vh;
  position:relative; display:flex; flex-direction:column;
}
.mc-main{flex:1; padding:0 16px 120px}

/* ── header ── */
.mc-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 18px 12px;
}
.mc-brand{display:flex; align-items:center; gap:7px}
.mc-brand-ico{color:var(--gold-d)}
.mc-brand-name{
  font-family:'Fraunces',serif; font-weight:600; font-size:18px;
  letter-spacing:-.02em; color:var(--pine)
}
.mc-header-right{display:flex; align-items:center; gap:9px}
.mc-avatar{
  width:40px; height:40px; border-radius:50%;
  display:grid; place-items:center; font-size:19px;
  box-shadow:0 0 0 2px rgba(255,255,255,.7), var(--shadow-sm);
  flex-shrink:0;
}
.mc-avatar.xl{width:80px; height:80px; font-size:38px; box-shadow:0 0 0 3px rgba(255,255,255,.8),var(--shadow)}

/* ── views ── */
.mc-view{display:flex; flex-direction:column; gap:14px; animation:rise .38s cubic-bezier(.2,.8,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── status card ── */
.mc-status{
  background:var(--paper); border:1px solid var(--line);
  border-radius:var(--r-card); padding:20px 20px 18px;
  box-shadow:var(--shadow);
}
.mc-status.is-done{
  background:linear-gradient(145deg,#EEF8EC 0%,var(--paper) 55%);
  border-color:#BFE0BC;
}
.mc-status-row{display:flex; align-items:center; gap:14px}
.mc-status-ring{
  width:56px; height:56px; border-radius:50%;
  display:grid; place-items:center; flex-shrink:0;
  background:var(--gold-soft); color:var(--gold-d);
  box-shadow:0 0 0 5px rgba(242,163,14,.12);
}
.is-done .mc-status-ring{
  background:linear-gradient(135deg,#C8ECC5,#DAF2D6);
  color:#2A7230;
  box-shadow:0 0 0 5px rgba(44,114,48,.1);
}
.mc-eyebrow{font-size:10.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--pine-3)}
.mc-status-title{
  font-family:'Fraunces',serif; font-weight:500; font-size:22px;
  margin:3px 0 0; letter-spacing:-.02em; line-height:1.15;
}
.mc-status-note{margin:13px 0 0; color:var(--pine-2); font-size:14px; line-height:1.5}

/* ── buttons ── */
.mc-cta{
  display:inline-flex; align-items:center; gap:5px;
  background:var(--pine); color:#F4FAF2; border:none;
  border-radius:var(--r-btn); padding:12px 20px;
  font-family:inherit; font-weight:600; font-size:15px;
  cursor:pointer; transition:transform .15s,box-shadow .15s,background .2s;
  margin-top:16px; letter-spacing:-.01em;
}
.mc-cta:hover{background:#0D221C; transform:translateY(-1px); box-shadow:0 4px 14px -4px rgba(20,48,42,.35)}
.mc-cta:active{transform:translateY(0); box-shadow:none}
.mc-cta.full{width:100%; justify-content:center; margin-top:20px; padding:15px 20px; font-size:16px; border-radius:16px}
.mc-cta:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none}
.mc-cta.ghost{background:transparent; color:var(--pine-2); border:1.5px solid var(--line); box-shadow:none}
.mc-cta.ghost:hover{background:var(--mist-2); box-shadow:none}
.mc-cta.danger{background:var(--clay)}
.mc-cta.danger:hover{background:#B84A28}
.mc-cta.ghost.danger{background:transparent; color:var(--clay); border-color:#EBC4B5}
.mc-cta.ghost.danger:hover{background:#FAEAE4}

/* ── trail ── */
.mc-trail{
  background:var(--paper); border:1px solid var(--line);
  border-radius:var(--r-card); padding:20px;
  box-shadow:var(--shadow);
}
.mc-trail-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
.mc-trail-count{display:flex; align-items:baseline; gap:6px; margin-top:3px}
.mc-bignum{
  font-family:'Fraunces',serif; font-size:56px; font-weight:600;
  line-height:.85; color:var(--pine); letter-spacing:-.03em;
}
.mc-bignum-unit{font-size:15px; color:var(--pine-2); font-weight:600; letter-spacing:-.01em}
.mc-flame{color:var(--gold-d); align-self:center; margin-left:2px}
.mc-trail-target{
  display:flex; align-items:center; gap:5px;
  background:var(--mist-2); border:1px solid var(--line-2);
  color:var(--pine-2); font-size:12px; padding:7px 11px;
  border-radius:10px; text-align:right; white-space:nowrap;
}
.mc-trail-target strong{color:var(--pine); font-weight:700}
.mc-trail-empty{color:var(--pine-2); font-size:14px; margin:14px 0 0; line-height:1.5}
.mc-path{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:18px 0 4px; padding:2px}
.mc-mark{
  width:11px; height:11px; border-radius:50%;
  background:var(--line-2); position:relative; transition:all .35s;
}
.mc-mark::after{
  content:''; position:absolute; left:100%; top:50%;
  width:8px; height:2px; transform:translateY(-50%);
  background:var(--line-2); border-radius:2px;
}
.mc-mark:last-of-type::after{display:none}
.mc-mark.on{background:var(--gold); box-shadow:0 0 0 3px rgba(240,163,14,.22)}
.mc-mark.on::after{background:var(--gold)}
.mc-mark.tip{
  background:var(--gold-d);
  box-shadow:0 0 0 4px rgba(240,163,14,.3);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 4px rgba(240,163,14,.3)}
  50%{box-shadow:0 0 0 8px rgba(240,163,14,.06)}
}
.mc-path-flag{
  display:grid; place-items:center; width:26px; height:26px;
  border-radius:8px; background:var(--pine); color:var(--gold); margin-left:2px;
}
.mc-longhaul{margin:18px 0 6px}
.mc-longhaul-bar{
  height:10px; background:var(--mist); border:1px solid var(--line-2);
  border-radius:10px; overflow:hidden;
}
.mc-longhaul-fill{
  height:100%;
  background:linear-gradient(90deg,#F5BC3A,var(--gold-d));
  border-radius:10px; transition:width .6s cubic-bezier(.4,0,.2,1);
}
.mc-longhaul-meta{display:flex; justify-content:space-between; margin-top:8px; font-size:12px; color:var(--pine-2)}
.mc-longhaul-meta span{display:inline-flex; align-items:center; gap:4px}
.mc-badges{display:flex; gap:7px; margin-top:16px; padding-top:16px; border-top:1px solid var(--line-2)}
.mc-badge{
  flex:1; display:flex; flex-direction:column; align-items:center;
  gap:3px; padding:10px 4px; border-radius:13px;
  background:var(--mist-2); color:var(--pine-3);
  border:1px solid var(--line-2); transition:all .2s;
}
.mc-badge.earned{
  background:linear-gradient(145deg,var(--gold-soft),#FDF4DC);
  color:var(--gold-d); border-color:#EDCC7E;
  box-shadow:0 1px 6px rgba(209,130,10,.15);
}
.mc-badge-n{font-size:10.5px; font-weight:700; letter-spacing:.04em}

/* ── cards ── */
.mc-card{
  background:var(--paper); border:1px solid var(--line);
  border-radius:var(--r-card); padding:18px;
  box-shadow:var(--shadow);
}
.mc-card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
.mc-card-title{
  font-family:'Fraunces',serif; font-size:16px; font-weight:600;
  margin:0 0 12px; letter-spacing:-.01em;
}
.mc-card-head .mc-card-title{margin:0}
.mc-link{
  display:inline-flex; align-items:center; gap:2px;
  background:none; border:none; color:var(--teal);
  font-family:inherit; font-weight:600; font-size:13px; cursor:pointer;
  padding:0;
}

/* ── empty ── */
.mc-empty{color:var(--pine-3); font-size:14px; margin:0; line-height:1.55}
.mc-empty.big{text-align:center; padding:36px 20px 28px; font-size:15px}

/* ── glance ── */
.mc-glance{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px}
.mc-glance-row{display:flex; align-items:center; gap:10px; font-size:14px}
.mc-dot{
  width:32px; height:32px; border-radius:50%;
  display:grid; place-items:center; font-size:15px;
  flex-shrink:0; color:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}
.mc-dot.lg{width:42px; height:42px; font-size:20px}
.mc-dot.sm{width:25px; height:25px; font-size:13px}
.mc-glance-name{font-weight:700}
.mc-glance-act{color:var(--pine-2)}
.mc-glance-time{margin-left:auto; color:var(--pine-3); font-size:12px; white-space:nowrap}

/* ── group header ── */
.mc-view-head{display:flex; align-items:center; justify-content:space-between; padding:4px 2px 2px}
.mc-h2{
  font-family:'Fraunces',serif; font-size:24px; font-weight:600;
  margin:8px 0; letter-spacing:-.02em;
}
.mc-icon-btn{
  background:var(--paper); border:1px solid var(--line);
  border-radius:12px; width:38px; height:38px;
  display:grid; place-items:center; color:var(--pine-2); cursor:pointer;
  box-shadow:var(--shadow-sm); transition:box-shadow .15s;
}
.mc-icon-btn:hover{box-shadow:var(--shadow)}
.mc-spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mc-banner{
  display:flex; gap:10px; align-items:flex-start;
  background:linear-gradient(135deg,var(--gold-soft),#FEF3D6);
  border:1px solid #EDCC7E; color:#7A4F08;
  border-radius:16px; padding:13px 15px; font-size:13px; line-height:1.5;
}

/* ── feed ── */
.mc-feed{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px}
.mc-feedcard{
  background:var(--paper); border:1px solid var(--line);
  border-radius:20px; padding:16px;
  box-shadow:var(--shadow); transition:box-shadow .2s;
}
.mc-feed-top{display:flex; align-items:center; gap:12px}
.mc-feed-id{display:flex; flex-direction:column; gap:1px}
.mc-feed-name{font-weight:700; font-size:15px; letter-spacing:-.01em}
.mc-feed-sub{color:var(--pine-2); font-size:13px}
.mc-feed-note{
  margin:12px 0 0; font-size:14px; color:var(--pine);
  font-family:'Fraunces',serif; font-style:italic;
  line-height:1.55; font-weight:400;
}
.mc-feed-photo{
  margin:12px -2px 0; border-radius:14px; overflow:hidden;
  background:var(--mist); line-height:0;
}
.mc-feed-photo img{
  width:100%; max-height:320px; object-fit:cover;
  display:block; border-radius:14px;
}
.mc-feed-actions{display:flex; gap:8px; margin-top:13px}
.mc-react{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--mist-2); border:1.5px solid var(--line-2);
  color:var(--pine-2); border-radius:12px;
  padding:8px 13px; font-family:inherit; font-size:13px;
  font-weight:600; cursor:pointer; transition:all .15s;
}
.mc-react:hover{border-color:var(--line); background:var(--mist)}
.mc-react.on{background:#FAEAE4; color:var(--clay); border-color:#F0BFAF}
.mc-comments{
  margin-top:13px; padding-top:13px;
  border-top:1px solid var(--line-2);
  display:flex; flex-direction:column; gap:10px;
}
.mc-comment{display:flex; gap:8px; align-items:flex-start}
.mc-comment-name{font-weight:700; font-size:13px; margin-right:5px}
.mc-comment-text{font-size:13.5px; color:var(--pine-2)}
.mc-comment-input{display:flex; gap:8px; align-items:center; margin-top:2px}
.mc-comment-input input{
  flex:1; border:1.5px solid var(--line); background:var(--mist-2);
  border-radius:12px; padding:10px 12px;
  font-family:inherit; font-size:14px; color:var(--pine);
}
.mc-comment-input input:focus{outline:2px solid var(--gold); outline-offset:1px; border-color:transparent}
.mc-comment-input button{
  background:var(--pine); color:#F4FAF2; border:none;
  border-radius:12px; width:40px; height:40px;
  display:grid; place-items:center; cursor:pointer; flex-shrink:0;
}
.mc-comment-input button:disabled{opacity:.35}

/* ── profile / you ── */
.mc-profile{
  display:flex; flex-direction:column; align-items:center;
  text-align:center; padding:12px 0 8px; gap:4px;
}
.mc-profile .mc-h2{margin:4px 0 14px}
.mc-profile-stats{display:flex; gap:8px; width:100%}
.mc-profile-stats>div{
  flex:1; background:var(--paper); border:1px solid var(--line);
  border-radius:16px; padding:14px 6px 12px;
  display:flex; flex-direction:column; align-items:center;
  box-shadow:var(--shadow-sm);
}
.mc-stat-n{
  font-family:'Fraunces',serif; font-size:28px; font-weight:600;
  line-height:1; color:var(--pine); letter-spacing:-.02em;
}
.mc-stat-l{
  font-size:10px; color:var(--pine-3); margin-top:5px;
  text-transform:uppercase; letter-spacing:.08em; font-weight:700;
}

/* ── heatmap ── */
.mc-heat{display:flex; gap:3px; justify-content:space-between}
.mc-heat-col{display:flex; flex-direction:column; gap:3px; flex:1}
.mc-heat-cell{
  aspect-ratio:1; border-radius:3px;
  background:var(--mist); border:1px solid var(--line-2);
  transition:background .2s;
}
.mc-heat-cell.on{background:var(--gold); border-color:var(--gold-d)}
.mc-heat-cell.fut{opacity:.35}

/* ── milestones list ── */
.mc-miles-list{display:flex; flex-direction:column; gap:1px}
.mc-mile-row{
  display:flex; align-items:center; gap:12px;
  padding:12px 4px; border-bottom:1px solid var(--line-2);
}
.mc-mile-row:last-child{border-bottom:none}
.mc-mile-ico{
  width:36px; height:36px; border-radius:11px;
  display:grid; place-items:center;
  background:var(--mist-2); color:var(--pine-3); flex-shrink:0;
}
.mc-mile-row.got .mc-mile-ico{background:var(--gold-soft); color:var(--gold-d)}
.mc-mile-txt{display:flex; flex-direction:column; flex:1; gap:1px}
.mc-mile-txt strong{font-size:14.5px; letter-spacing:-.01em}
.mc-mile-txt span{font-size:12px; color:var(--pine-3)}
.mc-mile-check{color:var(--teal)}
.mc-mile-lock{color:var(--line); font-weight:700}

/* ── toggle ── */
.mc-toggle{
  width:48px; height:28px; border-radius:14px;
  background:var(--line); border:none; position:relative;
  cursor:pointer; transition:background .2s; flex-shrink:0;
}
.mc-toggle.on{background:var(--teal)}
.mc-toggle-knob{
  position:absolute; top:3px; left:3px; width:22px; height:22px;
  border-radius:50%; background:#fff;
  transition:transform .2s cubic-bezier(.4,0,.2,1);
  box-shadow:0 1px 4px rgba(0,0,0,.2);
}
.mc-toggle.on .mc-toggle-knob{transform:translateX(20px)}
.mc-reminder-body{display:flex; align-items:center; gap:10px; color:var(--pine-2); margin-top:6px}
.mc-time{
  border:1.5px solid var(--line); background:var(--mist-2);
  border-radius:10px; padding:8px 11px;
  font-family:inherit; font-size:14px; color:var(--pine);
}
.mc-fineprint{font-size:12px; color:var(--pine-3); line-height:1.55; margin:12px 0 0}

/* ── nav ── */
.mc-nav{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:460px;
  display:flex; align-items:center; justify-content:space-around;
  padding:8px 14px calc(10px + env(safe-area-inset-bottom));
  background:rgba(250,252,249,.92);
  backdrop-filter:blur(16px) saturate(160%);
  -webkit-backdrop-filter:blur(16px) saturate(160%);
  border-top:1px solid var(--line);
}
.mc-nav>button{
  background:none; border:none;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--pine-3); font-family:inherit; font-size:10.5px;
  font-weight:600; cursor:pointer; padding:4px 16px;
  transition:color .18s; letter-spacing:.01em;
  position:relative;
}
.mc-nav>button.on{color:var(--pine)}
.mc-nav>button.on::after{
  content:''; position:absolute; bottom:-2px; left:50%;
  transform:translateX(-50%); width:18px; height:2.5px;
  border-radius:2px; background:var(--pine);
}
.mc-nav-log{padding:0}
.mc-nav-fab{
  display:grid; place-items:center; width:56px; height:56px;
  border-radius:50%; margin-top:-28px;
  background:linear-gradient(145deg,#F5BC3A,var(--gold-d));
  color:var(--pine);
  box-shadow:0 4px 16px -4px rgba(209,130,10,.55), 0 0 0 3px rgba(255,255,255,.6);
  transition:transform .15s, box-shadow .15s;
}
.mc-nav-log:hover .mc-nav-fab{transform:translateY(-2px); box-shadow:0 8px 22px -4px rgba(209,130,10,.6),0 0 0 3px rgba(255,255,255,.8)}
.mc-nav-fab.done{
  background:linear-gradient(145deg,#C8ECC5,#A8DCA4);
  color:#1E6B26;
  box-shadow:0 4px 16px -4px rgba(30,107,38,.3),0 0 0 3px rgba(255,255,255,.6);
}

/* ── overlays ── */
.mc-overlay{
  position:fixed; inset:0;
  background:rgba(14,38,30,.45);
  backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  display:flex; align-items:flex-end; justify-content:center;
  z-index:50; animation:fade .25s ease;
}
.mc-overlay.celebrate{align-items:center}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mc-sheet{
  width:100%; max-width:460px;
  background:var(--paper);
  border-radius:28px 28px 0 0;
  padding:8px 22px calc(30px + env(safe-area-inset-bottom));
  animation:slideup .32s cubic-bezier(.2,.9,.2,1);
  box-shadow:0 -4px 32px rgba(14,38,30,.12);
}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.mc-sheet-grab{
  width:36px; height:4px; border-radius:2px;
  background:var(--line); margin:8px auto 18px;
}
.mc-sheet-title{
  font-family:'Fraunces',serif; font-size:22px; font-weight:600;
  margin:0 0 18px; letter-spacing:-.02em;
}

/* ── seg control ── */
.mc-seg{
  display:flex; gap:5px; background:var(--mist-2);
  padding:5px; border-radius:16px; border:1px solid var(--line-2);
}
.mc-seg button{
  flex:1; border:none; background:none; padding:11px;
  border-radius:12px; font-family:inherit; font-weight:600;
  font-size:15px; color:var(--pine-3); cursor:pointer;
  transition:all .18s; letter-spacing:-.01em;
}
.mc-seg button.on{
  background:var(--paper); color:var(--pine);
  box-shadow:var(--shadow);
}

/* ── form fields ── */
.mc-field-label{
  display:block; font-size:11.5px; font-weight:700;
  text-transform:uppercase; letter-spacing:.1em; color:var(--pine-3);
  margin:20px 0 9px;
}
.mc-dist{display:flex; align-items:center; gap:10px}
.mc-dist button{
  width:50px; height:50px; border-radius:14px;
  border:1.5px solid var(--line); background:var(--mist-2);

<script>
(function(){

/* ---------- icons ---------- */
const P = (d,extra="") => `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}${extra}</svg>`;

};
const ic = (name, size=20) => P(ICONS[name]).replace('width="24" height="24"', `width="${size}" height="${size}"`);

/* ---------- date helpers ---------- */
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => ymd(new Date());
const shift = (s,n) => { const [y,m,dd]=s.split('-').map(Number); const d=new Date(y,m-1,dd); d.setDate(d.getDate()+n); return ymd(d); };
const prettyDate = s => { if(s===today())return"Today"; if(s===shift(today(),-1))return"Yesterday";
  const [y,m,dd]=s.split('-').map(Number); return new Date(y,m-1,dd).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); };
const sinceLabel = ts => { const s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return"just now"; if(s<3600)return Math.floor(s/60)+"m ago"; if(s<86400)return Math.floor(s/3600)+"h ago"; return Math.floor(s/86400)+"d ago"; };
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- streak + milestones ---------- */
const valid = e => e && e.distance >= 1;
const MILES = [
  {n:7,name:"First Week",sub:"7 days",icon:"sun"},
  {n:30,name:"A Full Month",sub:"30 days",icon:"flame"},
  {n:90,name:"A Whole Season",sub:"90 days",icon:"mtn"},
  {n:180,name:"Half a Year",sub:"180 days",icon:"mtn"},
  {n:365,name:"A Year of Miles",sub:"365 days",icon:"flag"},
];
function computeStreak(days){ if(!days)return 0; let s=0,c=today(); if(!valid(days[c]))c=shift(c,-1); while(valid(days[c])){s++;c=shift(c,-1);} return s; }
const nextMile = s => MILES.find(m=>m.n>s) || null;
const prevMile = s => { let r=0; for(const m of MILES) if(m.n<=s) r=m.n; return r; };
function bestEver(days){ const ds=Object.keys(days||{}).filter(d=>valid(days[d])).sort(); let best=0,run=0,prev=null;
  for(const d of ds){ if(prev && shift(prev,1)===d) run++; else run=1; best=Math.max(best,run); prev=d; } return Math.max(best,computeStreak(days)); }
const badgeIcon = k => k==="sun"?ic("sun",15):k==="flame"?ic("flame",15):k==="mtn"?ic("mtn",15):ic("flag",15);

/* ---------- identity options ---------- */
const COLORS=["#2C8C7F","#E8952A","#D95F3A","#6C7FD6","#8A5BB8","#3E7C45","#C9386A","#3B82C4","#7A6143","#1A7A5E"];
const EMOJI=["🏃","🚶","🥾","🌅","🐕","🌲","⛰️","☀️","🍃","🏔️","🐾","🌻","🦅","🌊","🌿","🎯"];

/* ---------- photo resize ---------- */
function resizeImage(file, maxPx=900, quality=0.72){
  return new Promise(resolve => {
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1, maxPx/Math.max(img.width,img.height));
        const canvas=document.createElement('canvas');
        canvas.width=Math.round(img.width*scale);
        canvas.height=Math.round(img.height*scale);
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ================= data layer ================= */
const LS = {
  get(k,f){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):f; }catch{ return f; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }
};

const Store = {
  mode: "local",
  me: null,
  members: {},
  db: null,
  ready: false,
  cloudStatus: "connecting",
  cloudError: "",

  async init(){
    this.me = LS.get("mileclub:me", null);
    if (FIREBASE_CONFIG){
      try {
        await loadFirebase();
        firebase.initializeApp(FIREBASE_CONFIG);
        this.db = firebase.firestore();
        this.mode = "cloud";
        this.db.collection("members").onSnapshot(snap=>{
          const m={}; snap.forEach(doc=>{ m[doc.id]=doc.data(); });
          this.members=m;
          if(this.cloudStatus !== "connected"){ this.cloudStatus="connected"; this.cloudError=""; }
          rerender();
        }, err=>{
          this.cloudStatus="solo";
          this.cloudError=err.code ? err.code + ": " + (err.message||"") : String(err);
          this.mode="local"; this._loadLocal(); rerender();
        });
        if (this.me) await this._ensureProfile();
      } catch(e){
        this.cloudStatus="solo";
        this.cloudError=e.message||String(e);
        this.mode="local"; this._loadLocal();
      }
    } else {
      this.cloudStatus="solo"; this.cloudError="No Firebase config";
      this.mode="local"; this._loadLocal();
    }
  },
  _loadLocal(){
    if(this.me){ const days=LS.get("mileclub:days:"+this.me.id,{});
      this.members={ [this.me.id]:{ profile:{name:this.me.name,color:this.me.color,emoji:this.me.emoji}, days } }; }
  },
  myDays(){ return (this.members[this.me?.id]||{}).days || {}; },

  async createMe(profile){
    const id="u_"+Math.random().toString(36).slice(2,9);
    this.me={ id, ...profile, reminderOn:false, reminderTime:"07:30" };
    LS.set("mileclub:me", this.me);
    if(this.mode==="cloud") await this._ensureProfile();
    else this._loadLocal();
  },
  saveMe(){ LS.set("mileclub:me", this.me); },
  async _ensureProfile(){
    const ref=this.db.collection("members").doc(this.me.id);
    await ref.set({ profile:{name:this.me.name,color:this.me.color,emoji:this.me.emoji}, updatedAt:Date.now() }, {merge:true});
  },

  async logDay({type,distance,note,photo}){
    const date=today(); const ts=Date.now();
    if(this.mode==="cloud"){
      const ref=this.db.collection("members").doc(this.me.id);
      const existing=this.myDays()[date];
      const day={ type, distance, note:note||"", ts,
        kudos: existing?.kudos||[], comments: existing?.comments||[],
        ...(photo!=null ? {photo} : existing?.photo ? {photo:existing.photo} : {}) };
      await ref.set({ days:{ [date]: day } }, {merge:true});
    } else {
      const days=this.myDays(); const existing=days[date];
      days[date]={ type, distance, note:note||"", ts,
        kudos: existing?.kudos||[], comments: existing?.comments||[],
        ...(photo!=null ? {photo} : existing?.photo ? {photo:existing.photo} : {}) };
      LS.set("mileclub:days:"+this.me.id, days);
      this.members[this.me.id].days=days;
    }
  },

  async toggleKudos(id,date){
    if(this.mode==="cloud"){
      const ref=this.db.collection("members").doc(id);
      const cur=(this.members[id]?.days?.[date]?.kudos)||[];
      const has=cur.includes(this.me.id);
      const fv=firebase.firestore.FieldValue;
      await ref.update({ ["days."+date+".kudos"]: has?fv.arrayRemove(this.me.id):fv.arrayUnion(this.me.id) });
    } else {
      const day=this.members[id].days[date]; const cur=day.kudos||[]; const has=cur.includes(this.me.id);
      day.kudos = has?cur.filter(x=>x!==this.me.id):[...cur,this.me.id];
      LS.set("mileclub:days:"+id, this.members[id].days); rerender();
    }
  },

  async addComment(id,date,text){
    const c={ byId:this.me.id, byName:this.me.name, byColor:this.me.color, byEmoji:this.me.emoji, text, ts:Date.now() };
    if(this.mode==="cloud"){
      const ref=this.db.collection("members").doc(id);
      await ref.update({ ["days."+date+".comments"]: firebase.firestore.FieldValue.arrayUnion(c) });
    } else {
      const day=this.members[id].days[date]; day.comments=[...(day.comments||[]),c];
      LS.set("mileclub:days:"+id, this.members[id].days); rerender();
    }
  },

  async clearMyData(){
    if(this.mode==="cloud"){
      const ref=this.db.collection("members").doc(this.me.id);
      try{ await ref.update({ days:{}, updatedAt:Date.now() }); }
      catch{ await this._ensureProfile(); }
    } else {
      LS.set("mileclub:days:"+this.me.id, {});
      if(this.members[this.me.id]) this.members[this.me.id].days={};
    }
  }
};

function loadFirebase(){
  return new Promise((res,rej)=>{
    const base="https://www.gstatic.com/firebasejs/10.12.0/";
    const a=document.createElement("script"); a.src=base+"firebase-app-compat.js";
    a.onload=()=>{ const b=document.createElement("script"); b.src=base+"firebase-firestore-compat.js";
      b.onload=res; b.onerror=rej; document.head.appendChild(b); };
    a.onerror=rej; document.head.appendChild(a);
  });
}

function flash(msg){ const t=document.getElementById("toast");

function feedEntries(){
  const out=[];
  Object.entries(Store.members).forEach(([id,m])=>{
    Object.entries(m.days||{}).forEach(([date,e])=>{ if(valid(e)) out.push({id,date,...e,profile:m.profile||{}}); });
  });
  out.sort((a,b)=>(b.ts||0)-(a.ts||0));
  return out;
}

function rerender(){
  const active=document.activeElement;
  let restore=null;
  if(active && active.dataset && active.dataset.cmt){ restore={key:active.dataset.cmt, val:active.value, pos:active.selectionStart}; }
  render();
  if(restore){ const el=document.querySelector(`input[data-cmt="${restore.key}"]`);
    if(el){ el.value=restore.val; el.focus(); try{ el.setSelectionRange(restore.pos,restore.pos); }catch{} } }
}

function renderTrail(streak){
  const next=nextMile(streak), prev=prevMile(streak);
  const target=next?next.n:streak, legLen=target-prev, done=streak-prev;
  const dots=legLen>0 && legLen<=31;
  let path;
  if(streak===0){ path=`<p class="mc-trail-empty">Walk or run a mile today to set out on the trail.</p>`; }
  else if(dots){
    let m=""; for(let i=0;i<legLen;i++){ const f=i<done,last=i===done-1; m+=`<span class="mc-mark ${f?'on':''} ${last?'tip':''}"></span>`; }
    path=`<div class="mc-path">${m}<span class="mc-path-flag">${ic("flag",15)}</span></div>`;
  } else {
    const pct=Math.min(100,(done/legLen)*100);
    path=`<div class="mc-longhaul"><div class="mc-longhaul-bar"><div class="mc-longhaul-fill" style="width:${pct}%"></div></div>
      <div class="mc-longhaul-meta"><span>${prev} ${ic("flag",11)}</span><span>${next?next.name+' · '+next.n:'beyond a year'} ${ic("flag",11)}</span></div></div>`;
  }
  const badges=MILES.map(m=>`<div class="mc-badge ${streak>=m.n?'earned':''}" title="${m.name} — ${m.sub}">
    <span>${badgeIcon(m.icon)}</span><span class="mc-badge-n">${m.n}</span></div>`).join("");
  return `<section class="mc-trail">
    <div class="mc-trail-head">
      <div>
        <div class="mc-eyebrow">Current streak</div>
        <div class="mc-trail-count">
          <span class="mc-bignum">${streak}</span>
          <span class="mc-bignum-unit">${streak===1?'day':'days'}</span>
          ${streak>0?`<span class="mc-flame">${ic("flame",22)}</span>`:''}
        </div>
      </div>
      ${next?`<div class="mc-trail-target">${ic("flag",14)}<span>${next.n-streak} to <strong>${next.name}</strong></span></div>`:''}
    </div>
    ${path}
    <div class="mc-badges">${badges}</div>
  </section>`;
}

function renderHeatmap(days){
  const cols=12; const start=shift(today(),-(cols*7-1));
  const [sy,sm,sd]=start.split('-').map(Number); const sdt=new Date(sy,sm-1,sd); sdt.setDate(sdt.getDate()-sdt.getDay());
  let out="";
  for(let w=0;w<cols;w++){ let col="";
    for(let d=0;d<7;d++){ const cur=new Date(sdt); cur.setDate(cur.getDate()+w*7+d); const k=ymd(cur);
      const on=valid(days[k]), fut=k>today(); col+=`<span class="mc-heat-cell ${on?'on':''} ${fut?'fut':''}" title="${k}"></span>`; }
    out+=`<div class="mc-heat-col">${col}</div>`; }
  return `<div class="mc-heat">${out}</div>`;
}

      <button class="mc-cta danger" style="margin-top:0" data-act="clear-confirm">Yes, clear it all</button>
      <button class="mc-cta ghost" style="margin-top:10px" data-act="celebrate-close">Keep my miles</button>
    </div></div>`;
}

function celebrate(m,streak){
  document.getElementById("overlay").innerHTML=`<div class="mc-overlay celebrate" data-act="celebrate-close">
    <div class="mc-celebrate">
      <div class="mc-celebrate-spark">${ic("spark",30)}</div>
      <div class="mc-celebrate-big">${streak}</div>
      <h3 class="mc-celebrate-name">${m.name}</h3>
      <p class="mc-celebrate-sub">You've reached a ${m.sub} streak.<br>Marker planted on the trail.</p>
      <button class="mc-cta" data-act="celebrate-close">Keep going ${ic("chevR",18)}</button>
    </div></div>`;
}

/* ================= reminders ================= */
function scheduleReminder(){
  if(reminderTimer) clearTimeout(reminderTimer);
  if(!Store.me || !Store.me.reminderOn || !Store.me.reminderTime) return;
  const [h,mn]=Store.me.reminderTime.split(":").map(Number);
  const now=new Date(), next=new Date(); next.setHours(h,mn,0,0); if(next<=now) next.setDate(next.getDate()+1);
  reminderTimer=setTimeout(()=>{
    if(valid(Store.myDays()[today()])) return;
    if(typeof Notification!=="undefined" && Notification.permission==="granted"){
      try{ new Notification("The Mile Club",{body:"Your mile is waiting. Keep the streak alive."}); }catch{}
    } else flash("Reminder: your mile is waiting today.");
    scheduleReminder();
  }, next-now);
}

/* ================= events ================= */
let obSel={color:COLORS[0],emoji:EMOJI[0]};
let epSel={color:COLORS[0],emoji:EMOJI[0]};

function updateObPreview(){
  const av=document.getElementById("ob-avatar");
  const nm=document.getElementById("ob-preview-name");
  const nameInput=document.getElementById("ob-name");
  if(av){ av.style.background=obSel.color; av.textContent=obSel.emoji; }
  if(nm && nameInput){ nm.textContent=nameInput.value.trim()||"Your name"; }
}

function updateEpPreview(){
  const av=document.getElementById("ep-avatar");
  const nm=document.getElementById("ep-preview-name");
  const nameEl=document.getElementById("ep-name");
  if(av){ av.style.background=epSel.color; av.textContent=epSel.emoji; }
  if(nm && nameEl){ nm.textContent=nameEl.value.trim()||Store.me.name; }
}

document.addEventListener("input", (ev)=>{
  const el=ev.target;
  if(el.id==="ep-name"){ updateEpPreview(); return; }
  if(el.dataset.act==="ep-emoji-input"){
    const raw=el.value;
    const match=raw.match(/\p{Emoji_Presentation}|\p{Emoji}️/u)||raw.match(/[\u{1F000}-\u{1FFFF}]/u);
    const chosen=match?match[0]:(raw.trim().slice(0,2)||"");
    if(chosen){ epSel.emoji=chosen;
      document.querySelectorAll('#sheet .mc-emoji-btn').forEach(b=>b.classList.remove('on'));
      updateEpPreview(); }
    return;
  }
  if(el.dataset.act==="ep-color-custom"){
    epSel.color=el.value;
    const prev=document.getElementById("ep-custom-color-preview");
    if(prev) prev.style.background=el.value;
    document.querySelectorAll('#sheet .mc-swatch').forEach(b=>b.classList.remove('on'));
    const wrap=el.closest('.mc-color-custom-wrap'); if(wrap) wrap.classList.add('on');
    updateEpPreview(); return;
  }
  if(el.id==="ob-name"){ updateObPreview(); return; }
  if(el.dataset.act==="ob-emoji-input"){
    const raw=el.value;
    const match=raw.match(/\p{Emoji_Presentation}|\p{Emoji}️/u) || raw.match(/[\u{1F000}-\u{1FFFF}]/u);
    const chosen=match ? match[0] : (raw.trim().slice(0,2)||"");
    if(chosen){ obSel.emoji=chosen;
      document.querySelectorAll('.mc-emoji-btn').forEach(b=>b.classList.remove('on'));
      updateObPreview(); }
    return;
  }
  if(el.dataset.act==="ob-color-custom"){
    obSel.color=el.value;
    const prev=document.getElementById("ob-custom-color-preview");
    if(prev) prev.style.background=el.value;
    document.querySelectorAll('.mc-swatch').forEach(b=>b.classList.remove('on'));
    const wrap=el.closest('.mc-color-custom-wrap'); if(wrap) wrap.classList.add('on');
    updateObPreview(); return;
  }
});

document.addEventListener("click", async (ev)=>{
  const el=ev.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act;

  if(act==="edit-profile"){
    epSel={color:Store.me.color, emoji:Store.me.emoji};
    openEditProfile(); return;
  }
  if(act==="ep-color"){
    epSel.color=el.dataset.c;
    document.querySelectorAll('#sheet .mc-swatch').forEach(b=>b.classList.toggle('on',b===el));
    const wrap=document.querySelector('#sheet .mc-color-custom-wrap'); if(wrap) wrap.classList.remove('on');
    updateEpPreview(); return;
  }
  if(act==="ep-emoji"){
    epSel.emoji=el.dataset.e;
    document.querySelectorAll('#sheet .mc-emoji-btn').forEach(b=>b.classList.toggle('on',b===el));
    const ci=document.getElementById("ep-emoji-input"); if(ci) ci.value="";
    updateEpPreview(); return;
  }
  if(act==="ep-save"){
    const name=(document.getElementById("ep-name").value||"").trim();
    if(!name){ document.getElementById("ep-name").focus(); flash("Name can't be empty."); return; }
    Store.me.name=name; Store.me.color=epSel.color; Store.me.emoji=epSel.emoji;
    Store.saveMe();
    if(Store.mode==="cloud") await Store._ensureProfile();
    closeOverlay(); rerender();
    flash("Profile updated.");
    return;
  }
  if(act==="log-open"){ openLog(); return; }
  if(act==="sheet-bg" && ev.target===el){ closeOverlay(); return; }
  if(act==="celebrate-close"){ closeOverlay(); return; }
  if(act==="seg"){ sheet.type=el.dataset.t;
    document.getElementById("seg-walk").classList.toggle("on",sheet.type==="walk");
    document.getElementById("seg-run").classList.toggle("on",sheet.type==="run"); return; }
  if(act==="dist"){ const inp=document.getElementById("dist");
    let v=(parseFloat(inp.value)||0)+(el.dataset.d==="1"?0.25:-0.25); v=Math.max(0,v);
    inp.value=v.toFixed(2).replace(/\.00$/,""); document.getElementById("warn").style.display=v<1?"block":"none"; return; }
  if(act==="photo-clear"){
    sheet.photo=null;
    const area=document.getElementById("photo-area");
    if(area) area.innerHTML=`<label class="mc-photo-label" for="photo-input">${ic("camera",18)} Add a photo</label>
      <input type="file" id="photo-input" accept="image/*" style="display:none" data-act="photo-pick" />`;
    return;
  }
  if(act==="log-save"){
    const dist=parseFloat(document.getElementById("dist").value)||0;
    const note=document.getElementById("note").value;
    const before=computeStreak(Store.myDays());
    await Store.logDay({type:sheet.type,distance:dist,note,photo:sheet.photo});
    closeOverlay();
    const after=computeStreak(Store.myDays());
    const hit=MILES.find(m=>m.n===after && before<m.n);
    if(Store.mode==="local") rerender();
    if(hit) celebrate(hit,after);
    else flash(dist>=1?"Marker planted. Streak's alive.":"Logged — but it takes a full mile to count.");
    return;
  }

  if(act==="clear-open"){ openClearConfirm(); return; }
  if(act==="clear-confirm"){
    el.disabled=true;
    try{
      await Store.clearMyData();
      closeOverlay(); rerender();
      flash("All clear — a fresh trail.");
    }catch(e){
      el.disabled=false;
      flash("Couldn't clear: "+(e.message||e));
    }
    return;
  }

  if(act==="view-today"){ state.view="today"; rerender(); return; }
  if(act==="view-group"){ state.view="group"; rerender(); return; }
  if(act==="view-you"){ state.view="you"; rerender(); return; }
  if(act==="refresh"){ const i=el.querySelector("svg"); if(i)i.classList.add("mc-spin"); setTimeout(()=>rerender(),400); return; }

  if(act==="kudos"){ const [id,date]=el.dataset.key.split("__"); await Store.toggleKudos(id,date); return; }
  if(act==="toggle-comments"){ state.openComments[el.dataset.key]=!state.openComments[el.dataset.key]; rerender(); return; }
  if(act==="comment-send"){
    const inp=document.querySelector(`input[data-cmt="${el.dataset.key}"]`); const text=(inp.value||"").trim();
    if(!text) return; const [id,date]=el.dataset.key.split("__"); inp.value="";
    await Store.addComment(id,date,text); return;
  }

  if(act==="reminder-toggle"){ Store.me.reminderOn=!Store.me.reminderOn; Store.saveMe();
    if(Store.me.reminderOn && typeof Notification!=="undefined" && Notification.permission==="default"){ try{ await Notification.requestPermission(); }catch{} }
    scheduleReminder(); rerender(); return; }

  if(act==="ob-color"){
    obSel.color=el.dataset.c;
    document.querySelectorAll('.mc-swatch').forEach(b=>b.classList.toggle('on',b===el));
    const wrap=document.querySelector('.mc-color-custom-wrap'); if(wrap) wrap.classList.remove('on');
    updateObPreview(); return;
  }
  if(act==="ob-emoji"){
    obSel.emoji=el.dataset.e;
    document.querySelectorAll('.mc-emoji-btn').forEach(b=>b.classList.toggle('on',b===el));
    const ci=document.getElementById("ob-emoji-input"); if(ci) ci.value="";
    updateObPreview(); return;
  }
  if(act==="ob-done"){
    const name=(document.getElementById("ob-name").value||"").trim();
    if(!name){ document.getElementById("ob-name").focus(); flash("Add a name to set out."); return; }
    await Store.createMe({name,color:obSel.color,emoji:obSel.emoji}); rerender(); scheduleReminder(); return;
  }
});

document.addEventListener("keydown",(ev)=>{
  if(ev.key==="Enter" && ev.target.dataset && ev.target.dataset.cmt){
    const key=ev.target.dataset.cmt; const btn=document.querySelector(`[data-act="comment-send"][data-key="${key}"]`); if(btn) btn.click();
  }
});
document.addEventListener("change",(ev)=>{
  const el=ev.target.closest("[data-act]"); if(!el) return;
  if(el.dataset.act==="photo-pick"){
    const file=el.files && el.files[0]; if(!file) return;
    const area=document.getElementById("photo-area");
    if(area){ area.innerHTML=`<div class="mc-photo-preview" id="photo-preview">
      <img src="" alt="Today's photo" id="photo-img-preview" style="opacity:.5" />
      <button class="mc-photo-remove" data-act="photo-clear" aria-label="Remove photo">×</button>
    </div><input type="file" id="photo-input" accept="image/*" style="display:none" data-act="photo-pick" />`; }
    resizeImage(file).then(dataUrl=>{
      sheet.photo=dataUrl;
      const img=document.getElementById("photo-img-preview");
      if(img){ img.src=dataUrl; img.style.opacity='1'; }
    });
    return;
  }
  if(el.dataset.act==="reminder-time"){ Store.me.reminderTime=el.value; Store.saveMe(); scheduleReminder(); }
  if(el.dataset.act==="ob-color-custom"){
    obSel.color=el.value;
    const prev=document.getElementById("ob-custom-color-preview");
    if(prev) prev.style.background=el.value;
    document.querySelectorAll('.mc-swatch').forEach(b=>b.classList.remove('on'));
    const wrap=el.closest('.mc-color-custom-wrap'); if(wrap) wrap.classList.add('on');
    updateObPreview();
  }
  if(el.dataset.act==="ep-color-custom"){
    epSel.color=el.value;
    const prev=document.getElementById("ep-custom-color-preview");
    if(prev) prev.style.background=el.value;
    document.querySelectorAll('#sheet .mc-swatch').forEach(b=>b.classList.remove('on'));
    const wrap=el.closest('.mc-color-custom-wrap'); if(wrap) wrap.classList.add('on');
    updateEpPreview();
  }
});

/* ================= boot ================= */
(async function(){
  await Store.init();
  Store.ready=true;
  render();
  scheduleReminder();
})();

})();
</script>
